<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 카톡·스레드 링크 미리보기용 1200×630 (DESIGN.md 토큰) */
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; }
body { background: #FBF8F4; color: #221C18; font-family: "Pretendard Variable", Pretendard, "Noto Sans CJK KR", sans-serif;
  letter-spacing: -0.02em; word-break: keep-all; padding: 72px 80px; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 800; margin-bottom: 40px; }
.dot { width: 22px; height: 22px; border-radius: 99px; background: #E0533A; }
h1 { font-size: 76px; line-height: 1.2; font-weight: 800; }
.accent { color: #C0402A; }
p { font-size: 32px; color: #74695F; margin-top: 28px; font-weight: 600; }
.icons { display: grid; grid-template-columns: repeat(2, 150px); gap: 20px; }
.icons img { width: 150px; height: 150px; }
</style>
</head>
<body>
<div>
  <div class="brand"><span class="dot"></span>{{ site_name }}</div>
  <h1>신청 안 하면 <span class="accent">0원</span>,<br>우리 아이 혜택</h1>
  <p>임신·출산·육아 지원금 매일 자동 업데이트</p>
</div>
<div class="icons">
  <img src="{{ emoji }}/pregnancy.png" alt=""><img src="{{ emoji }}/birth.png" alt="">
  <img src="{{ emoji }}/infant.png" alt=""><img src="{{ emoji }}/elementary.png" alt="">
</div>
</body>
</html>
